
services:
  frontend:
    build:
      context: react-frontend
      dockerfile: Dockerfile
    volumes:
      - ./react-frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - react-frontend/.env
    networks:
      - app-network

  backend:
    build:
      context: django-backend
      dockerfile: Dockerfile
    volumes: # Quitar en prod
      - ./django-backend:/app
    ports:
      - "8000:8000"
    env_file:
      - django-backend/.env
    networks:
      - app-network

  # Uncomment and configure for production database
  # db:
  #   image: postgres:13
  #   environment:
  #     POSTGRES_DB: pointcloud
  #     POSTGRES_USER: user
  #     POSTGRES_PASSWORD: password
  #   volumes:
  #     - db-data:/var/lib/postgresql/data
  #   networks:
  #     - app-network

networks:
  app-network:

